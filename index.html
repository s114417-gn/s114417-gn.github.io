<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馬卡龍客製化轉盤</title>
    <style>
        /* 基礎設定：確保在所有裝置上都能滿版且不會產生多餘捲軸 */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #fdfaf6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #555;
        }
        
        /* 容器設定：預設為電腦版的左右排列 */
        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 900px;
            width: 100%;
            align-items: center;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
            flex-shrink: 0;
        }

        textarea {
            resize: none;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #eee;
            border-radius: 12px;
            outline: none;
            line-height: 1.5;
            transition: border-color 0.3s;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }
        textarea:focus {
            border-color: #ffd1dc;
        }

        button {
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff6b81; 
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            width: 100%;
        }
        button:hover {
            background-color: #ff4757;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: #e0e0e0;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #ff4757;
            min-height: 30px;
        }

        /* 轉盤容器：改為自適應正方形 */
        .wheel-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 400px; /* 電腦版最大寬度 */
            aspect-ratio: 1 / 1; /* 保持正方形比例 */
        }

        .pointer {
            position: absolute;
            top: -5%; /* 改用百分比，讓指針隨轉盤縮放時保持好比例 */
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            /* 指針大小使用 vw 或固定大小的折衷方案，這裡保持稍微固定但相對位置正確 */
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #ff6b81; 
            z-index: 10;
        }

        /* Canvas 本身填滿父容器，內部畫質保持 400x400 確保銳利度 */
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            display: block;
        }

        /* 📱 手機版與平板版 RWD 設定 (寬度小於 768px 時觸發) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column; /* 改為上下排列 */
                padding: 20px;
                gap: 20px;
            }
            .controls {
                width: 100%; /* 輸入框與按鈕撐滿寬度 */
            }
            textarea {
                rows: 6; /* 手機上稍微減少預設行數，避免佔用太多空間 */
            }
            .wheel-container {
                max-width: 320px; /* 手機上限制一下轉盤最大寬度避免過於擁擠 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label for="optionsInput"><strong>輸入選項 (即時更新)：</strong></label>
        <textarea id="optionsInput" rows="6" wrap="off">吃火鍋
吃拉麵
吃便當
吃義大利麵
吃麥當勞
減肥不吃</textarea>
        <button id="spinBtn">開始旋轉！</button>
        <div class="result-box" id="resultText"></div>
    </div>

    <div class="wheel-wrapper">
        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const optionsInput = document.getElementById('optionsInput');
    const spinBtn = document.getElementById('spinBtn');
    const resultText = document.getElementById('resultText');

    let options = [];
    let currentRotation = 0;

    function getMacaronColor(index, total) {
        const hue = (index * 360) / total;
        return `hsl(${hue}, 75%, 80%)`;
    }

    function initWheel() {
        options = optionsInput.value.split('\n').map(opt => opt.trim()).filter(opt => opt !== "");
        
        if (options.length === 0) {
            options = ["請輸入選項"];
        }
        
        drawWheel();
    }

    function drawWheel() {
        const numOptions = options.length;
        const sliceAngle = (2 * Math.PI) / numOptions;
        
        // 內部繪圖邏輯始終以 400x400 的解析度為基準
        const centerX = 200;
        const centerY = 200;
        const radius = 200;

        ctx.clearRect(0, 0, 400, 400);

        for (let i = 0; i < numOptions; i++) {
            const startAngle = i * sliceAngle;
            const endAngle = startAngle + sliceAngle;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.fillStyle = getMacaronColor(i, numOptions);
            ctx.fill();
            
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#555555"; 
            
            let fontSize = Math.max(10, Math.min(22, sliceAngle * radius * 0.6));
            ctx.font = `bold ${fontSize}px 'Microsoft JhengHei', sans-serif`;
            
            let textWidth = ctx.measureText(options[i]).width;
            let maxTextWidth = radius - 40; 
            
            if (textWidth > maxTextWidth) {
                fontSize = fontSize * (maxTextWidth / textWidth);
                ctx.font = `bold ${fontSize}px 'Microsoft JhengHei', sans-serif`;
            }

            ctx.fillText(options[i], radius - 20, 0);
            ctx.restore();
        }
    }

    function spinWheel() {
        if (options.length === 0 || options[0] === "請輸入選項") return;

        spinBtn.disabled = true;
        optionsInput.disabled = true;
        resultText.innerText = "旋轉中...";

        const winnerIndex = Math.floor(Math.random() * options.length);
        
        const sliceAngleDeg = 360 / options.length;
        const initialWinnerCenterDeg = (winnerIndex + 0.5) * sliceAngleDeg;
        const targetBase = 270 - initialWinnerCenterDeg;
        
        const normalizedTarget = (targetBase % 360 + 360) % 360;
        const normalizedCurrent = (currentRotation % 360 + 360) % 360;
        
        let rotationDiff = normalizedTarget - normalizedCurrent;
        if (rotationDiff <= 0) {
            rotationDiff += 360;
        }

        currentRotation += rotationDiff + 1800;

        canvas.style.transition = 'transform 4s cubic-bezier(0.25, 0.1, 0.25, 1)';
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            resultText.innerText = `🎉 結果：${options[winnerIndex]}`;
            spinBtn.disabled = false;
            optionsInput.disabled = false;
        }, 4000);
    }

    optionsInput.addEventListener('input', () => {
        canvas.style.transition = 'none';
        currentRotation = 0;
        canvas.style.transform = `rotate(0deg)`;
        resultText.innerText = "";
        initWheel();
    });
    
    spinBtn.addEventListener('click', spinWheel);

    initWheel();
</script>

</body>
</html>
